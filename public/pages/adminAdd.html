<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Mẫu Quản Trị Hệ Thống</title>
    <link rel="stylesheet" href="../css/timKiem.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <div class="container">
        <div class="header-actions">
            <h1 id="pageTitle">Thêm Mới Bác Sĩ</h1>
            <a href="/" class="btn-back">Quay Lại</a>
        </div>

        <div class="search-panel">
            <form id="adminForm" class="search-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Họ và Tên</label>
                        <input type="text" id="hoTen" required placeholder="Nguyễn Văn A">
                    </div>

                    <div class="form-group">
                        <label>Chuyên Khoa</label>
                        <select id="chuyenKhoa" required>
                            <option value="Đa khoa">Đa khoa</option>
                            <option value="Sản phụ khoa">Sản phụ khoa</option>
                            <option value="Nhi khoa">Nhi khoa</option>
                            <option value="Mắt">Mắt</option>
                            <option value="Nha khoa">Nha khoa</option>
                            <option value="Da liễu">Da liễu</option>
                            <option value="Tim mạch">Tim mạch</option>
                            <option value="Nội tiết">Nội tiết</option>
                            <option value="Điều dưỡng">Điều dưỡng</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Số Điện Thoại</label>
                        <input type="text" id="soDienThoai" required placeholder="0987654321">
                    </div>

                    <div class="form-group">
                        <label>Tuổi</label>
                        <input type="number" id="tuoi" required placeholder="40" min="20" max="100">
                    </div>

                    <div class="form-group full-width">
                        <label>Chọn Hình Ảnh (có trong thư mục)</label>
                        <div style="display: flex; align-items: center; gap: 16px;">
                            <select id="hinhAnh"
                                style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px;">
                                <option value="">-- Đang tải danh sách ảnh... --</option>
                            </select>
                            <img id="hinhAnhPreview" src="" alt="Preview"
                                style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover; display: none; border: 1px solid #ddd;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Quận/Huyện</label>
                        <input type="text" id="quan" required placeholder="VD: Quận 1">
                    </div>

                    <div class="form-group">
                        <label>Tỉnh/Thành Phố</label>
                        <input type="text" id="thanhPho" required placeholder="VD: Hồ Chí Minh">
                    </div>

                    <div class="form-group full-width">
                        <label>Ngày Làm Việc (Chọn các khối)</label>
                        <div class="schedule-checkboxes" id="ngayLamViecContainer">
                            <label><input type="checkbox" value="Thứ 2"> Thứ 2</label>
                            <label><input type="checkbox" value="Thứ 3"> Thứ 3</label>
                            <label><input type="checkbox" value="Thứ 4"> Thứ 4</label>
                            <label><input type="checkbox" value="Thứ 5"> Thứ 5</label>
                            <label><input type="checkbox" value="Thứ 6"> Thứ 6</label>
                            <label><input type="checkbox" value="Thứ 7"> Thứ 7</label>
                            <label><input type="checkbox" value="Chủ nhật"> Chủ nhật</label>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn-submit" id="btnSubmit">Lưu Thông Tin Mới</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let form, pageTitle, btnSubmit;

        document.addEventListener('DOMContentLoaded', () => {
            initForm();
        });

        async function initForm() {
            form = document.getElementById('adminForm');
            pageTitle = document.getElementById('pageTitle');
            btnSubmit = document.getElementById('btnSubmit');

            await loadImages();

            form.addEventListener('submit', handleFormSubmit);
        }

        async function loadImages() {
            const select = document.getElementById('hinhAnh');
            const preview = document.getElementById('hinhAnhPreview');

            const res = await fetch('/api/images');
            const files = await res.json();

            select.innerHTML = '<option value="">-- Chọn hình ảnh --</option>';
            files.forEach(file => {
                const opt = document.createElement('option');
                opt.value = file;
                opt.textContent = file;
                select.appendChild(opt);
            });

            select.addEventListener('change', () => {
                if (select.value) {
                    preview.src = '/images/' + select.value;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const selectedDays = Array.from(document.querySelectorAll('#ngayLamViecContainer input[type="checkbox"]:checked')).map(box => box.value);

            const formData = {
                hoTen: document.getElementById('hoTen').value,
                chuyenKhoa: document.getElementById('chuyenKhoa').value,
                soDienThoai: document.getElementById('soDienThoai').value,
                tuoi: parseInt(document.getElementById('tuoi').value),
                anhDaiDien: document.getElementById('hinhAnh').value,
                diaChi: {
                    quan: document.getElementById('quan').value,
                    thanhPho: document.getElementById('thanhPho').value
                },
                ngayLamViec: selectedDays
            };

            try {
                const response = await fetch('/api/bacsi', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const ketQua = await response.json();

                if (response.ok) {
                    alert(ketQua.message);
                    form.reset();
                    document.getElementById('hinhAnhPreview').style.display = 'none';
                } else {
                    alert(`Lỗi: ${ketQua.message}`);
                }
            } catch (err) {
                console.error("Lỗi Gửi API", err);
                alert("Lỗi kết nối máy chủ");
            }
        }
    </script>
</body>

</html>
